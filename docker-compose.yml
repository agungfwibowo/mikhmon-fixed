services:
  php:
    image: php:8.2-fpm
    container_name: php
    tty: true
    working_dir: /var/www
    volumes: 
      - .:/var/www/    
    networks: 
      mikhmon_network:
        ipv4_address: 172.27.0.5
  nginx:
    image: nginx:alpine
    container_name: nginx
    tty: true
    volumes: 
      - .:/var/www/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports: 
      - "8088:80"
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.6
